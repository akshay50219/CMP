<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Author Dashboard</title>
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
</head>
<body>
  <header>
    <h1>Author Dashboard</h1>
  </header>

  <section class="upload-section">
    <h2>Submit New Paper</h2>
    <form id="paperForm">
      <input type="text" placeholder="Title" id="title" required />
      <textarea placeholder="Abstract" id="abstract" required></textarea>
      <input type="text" placeholder="Keywords (comma separated)" id="keywords" />
      <input type="file" id="paperFile" accept=".pdf,.docx" required />
      <button type="submit">Submit Paper</button>
    </form>
  </section>

  <section class="papers-section">
    <h2>My Submissions</h2>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Status</th>
          <th>Decision</th>
        </tr>
      </thead>
      <tbody id="papersTable"></tbody>
    </table>
  </section>

  <script src="../assets/js/author-dashboard.js"></script>
</body>
</html>
